[package]
name = "unword"
version = "0.2.2"
edition = "2021"
description = "MS Word .doc (OLE/CFB) to Markdown converter"
license = "MIT"
repository = "https://github.com/dridk/unword"
keywords = ["doc", "word", "markdown", "converter", "ole"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "unword"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "unword"
path = "src/main.rs"

[dependencies]
cfb = "0.14"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
encoding_rs = "0.8"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"], optional = true }

[features]
default = []
python = ["pyo3"]
